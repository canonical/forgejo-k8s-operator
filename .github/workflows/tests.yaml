name: Tests

on:
  workflow_call:
    inputs:
      commit_sha:
        description: Commit SHA to checkout
        type: string
        required: false
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Commit SHA to checkout
        type: string
        required: false

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tox

      - name: Run linter
        run: tox -e lint

      - name: Run static type checker
        run: tox -e static

      - name: Run unit tests
        run: tox -e unit

  integration-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install concierge
        run: sudo snap install --classic concierge

      - name: Prepare runner (microk8s, juju, charmcraft)
        run: sudo concierge prepare -p microk8s

      - name: Wait for MicroK8s addons to settle (dns)
        run: |
          set -euo pipefail
          sudo microk8s status --wait-ready --timeout 300
          sudo microk8s kubectl wait --for=condition=Ready pod -l k8s-app=kube-dns -n kube-system --timeout=300s
          sudo microk8s kubectl get pods -n kube-system -l k8s-app=kube-dns -o wide

      - name: Install tox
        run: |
          python -m pip install --upgrade pip
          pip install tox

      - name: Run integration tests
        run: tox -e integration
